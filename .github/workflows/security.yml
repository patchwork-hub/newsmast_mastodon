name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "22 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on pull requests and on pushes to main. A push compares the commit
  # before the push with the pushed commit; scheduled runs have no change set.
  dependency-review:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          base-ref: ${{ github.event_name == 'push' && github.event.before || '' }}
          head-ref: ${{ github.event_name == 'push' && github.sha || '' }}

  bundler-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup runtime
        uses: ./.github/actions/setup
        with:
          ruby-version: "3.4"

      - name: Run bundler-audit
        run: |
          gem install bundler-audit
          # Temporary ignores for advisories inherited from upstream host stack.
          # Keep this list minimal and remove entries once dependencies are upgraded.
          bundle-audit check --update \
            --ignore \
              CVE-2025-68696 GHSA-hm5p-x4rq-38w4 \
              CVE-2026-47736 GHSA-qpgp-93vx-g8v8 \
              CVE-2026-47737 GHSA-2vqw-3mp8-cgmx

  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ZIZMOR_VERSION: "1.16.3"
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Run actionlint
        run: |
          set -euo pipefail
          ASSET="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          CHECKSUMS="actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          BASE_URL="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"

          curl -fsSLO "${BASE_URL}/${ASSET}"
          curl -fsSLO "${BASE_URL}/${CHECKSUMS}"
          grep " ${ASSET}$" "${CHECKSUMS}" | sha256sum -c -
          tar -xzf "${ASSET}" actionlint
          ./actionlint -color

      - name: Run zizmor
        env:
          # A token enables zizmor's online audits, including impostor-commit
          # (pinned SHAs that aren't reachable in the action's own repository).
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install --user --disable-pip-version-check "zizmor==${ZIZMOR_VERSION}"
          ~/.local/bin/zizmor .github/workflows .github/actions

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ruby

      - name: Autobuild
        uses: github/codeql-action/autobuild@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
