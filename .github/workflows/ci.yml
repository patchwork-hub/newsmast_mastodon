name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      host_mastodon_repo:
        description: "Host Mastodon repository (owner/repo) for the host-integration job"
        required: false
        type: string
        default: "mastodon/mastodon"
      host_mastodon_ref:
        description: "Host Mastodon ref (branch/tag/SHA). Empty uses v<mastodon_version_requirement> from the gemspec."
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changelog-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Runs on pull requests and on pushes to main (which compares the pushed
    # range and honours the no-changelog label of the PR that was merged).
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require changelog update for code changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            LABELS="$PR_LABELS"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
            # Labels of the pull request(s) the pushed commit came from.
            LABELS=$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" --jq '[.[].labels[].name]')
          fi

          if echo "$LABELS" | grep -q '"no-changelog"'; then
            echo "✅ Skipped: pull request is labelled no-changelog"
            exit 0
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "✅ No previous commit to compare against"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA"...HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Check if any code or behavior files changed
          CODE_CHANGES=$(echo "$CHANGED_FILES" | grep -E '^(app/|lib/|bin/|db/|spec/|Gemfile|newsmast_mastodon\.gemspec|Rakefile|\.github/workflows)' || true)

          # Check if CHANGELOG.md was updated
          CHANGELOG_CHANGED=$(echo "$CHANGED_FILES" | grep -E '^CHANGELOG\.md$' || true)

          if [ -n "$CODE_CHANGES" ] && [ -z "$CHANGELOG_CHANGED" ]; then
            echo "❌ CHANGELOG.md must be updated when code or behavior changes."
            echo "Changed code files:"
            echo "$CODE_CHANGES"
            exit 1
          fi
          echo "✅ Changelog policy passed"

  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
    timeout-minutes: 15
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup runtime
        uses: ./.github/actions/setup
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Prepare RuboCop cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ matrix.ruby }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ matrix.ruby }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bundle exec rubocop --format github

  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup runtime
        uses: ./.github/actions/setup
        with:
          ruby-version: "3.4"

      - name: Verify routes, controllers, and Postman docs are in sync
        run: bundle exec rake api:verify

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
    timeout-minutes: 30

    services:
      redis:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup runtime
        uses: ./.github/actions/setup
        with:
          ruby-version: ${{ matrix.ruby }}

      - name: Run specs
        run: |
          if [ "${{ matrix.ruby }}" = "4.0" ]; then
            COVERAGE_MINIMUM=1 bundle exec rspec --format documentation
          else
            bundle exec rspec --format documentation
          fi

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-ruby-${{ matrix.ruby }}
          path: coverage
          if-no-files-found: ignore

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: screenshots-ruby-${{ matrix.ruby }}
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # Separate Postgres validation keeps default specs in sqlite mode while still
  # running a targeted spec subset against a real Postgres service.
  test-postgres-subset:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newsmast_mastodon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/newsmast_mastodon_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup runtime
        uses: ./.github/actions/setup
        with:
          ruby-version: "3.4"

      - name: Bootstrap minimal Postgres schema for standalone specs
        run: |
          bundle exec rails runner script/ci/bootstrap_postgres_subset.rb

      - name: Run Postgres-backed spec subset
        run: |
          bundle exec rspec \
            spec/models/newsmast_mastodon/server_setting_spec.rb \
            spec/models/newsmast_mastodon/wait_list_spec.rb \
            spec/models/newsmast_mastodon/patchwork_setting_spec.rb \
            spec/models/newsmast_mastodon/notification_token_spec.rb \
            spec/models/newsmast_mastodon/community_spec.rb \
            spec/lib/newsmast_mastodon/schema_load_migrations_spec.rb \
            --format documentation

  # Upgrade-safety gates. These are static checks (no DB/services needed) that
  # protect every Mastodon upgrade cycle — see docs/internal/mastodon-upgrade/RUNBOOK.md.
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Setup runtime
        uses: ./.github/actions/setup
        with:
          ruby-version: "3.4"

      - name: Migration idempotency + version sync gates
        run: bundle exec rspec spec/compatibility --format documentation

  # Compares the upstream Mastodon files that the gem overrides (see
  # config/override_baselines.yml) with upstream Mastodon at the version the
  # gem targets, so an upstream change to an overridden file is caught.
  override-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout gem
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: gem
          persist-credentials: false

      - name: Read target Mastodon version
        id: target
        working-directory: gem
        run: |
          version=$(ruby -e 'print Gem::Specification.load("newsmast_mastodon.gemspec").metadata.fetch("mastodon_version_requirement")')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream Mastodon
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: mastodon/mastodon
          ref: v${{ steps.target.outputs.version }}
          path: upstream
          sparse-checkout: app
          persist-credentials: false

      - name: Check vendored override drift
        run: ruby gem/bin/check-override-drift upstream

  # Installs this checkout of the gem into upstream Mastodon at the version the
  # gem targets (the host's Gemfile entry is rewritten to a local path), runs
  # `newsmast_mastodon:install`, and runs the full spec suite in host mode, so
  # specs that need Mastodon models, Fabricators and routes run instead of
  # being skipped. A different host can be chosen with workflow_dispatch.
  host-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      HOST_MASTODON_REPO: ${{ inputs.host_mastodon_repo || 'mastodon/mastodon' }}
      RAILS_ENV: test
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: postgres
      DB_PASS: postgres
      REDIS_URL: redis://localhost:6379/0
      BUNDLE_GEMFILE: ${{ github.workspace }}/host/Gemfile
      BUNDLE_PATH: ${{ github.workspace }}/host/vendor/bundle
      BUNDLE_FROZEN: "false"
      BUNDLE_DEPLOYMENT: "false"
      BUNDLE_WITHOUT: development:production

    steps:
      - name: Checkout gem
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: gem
          persist-credentials: false

      - name: Read target Mastodon version
        id: target
        working-directory: gem
        run: |
          version=$(ruby -e 'print Gem::Specification.load("newsmast_mastodon.gemspec").metadata.fetch("mastodon_version_requirement")')
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Checkout host Mastodon
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: ${{ env.HOST_MASTODON_REPO }}
          ref: ${{ inputs.host_mastodon_ref || format('v{0}', steps.target.outputs.version) }}
          path: host
          persist-credentials: false

      - name: Setup runtime
        uses: ./gem/.github/actions/setup
        with:
          ruby-version: .ruby-version
          working-directory: host
          bundler-cache: "false"
          extra-packages: libicu-dev libpq-dev libvips-dev

      - name: Cache host gems
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: host/vendor/bundle
          key: host-gems-${{ runner.os }}-${{ hashFiles('host/.ruby-version', 'host/Gemfile.lock', 'gem/newsmast_mastodon.gemspec') }}
          restore-keys: |
            host-gems-${{ runner.os }}-

      - name: Use this gem checkout in the host
        run: ruby gem/script/ci/use_local_gem_in_host.rb host gem

      - name: Install host dependencies
        working-directory: host
        run: bundle install --jobs 4

      - name: Install gem files into the host
        working-directory: host
        run: bin/rails newsmast_mastodon:install

      - name: Prepare host test database
        working-directory: host
        # The gem runs its own migrations after the schema load
        # (NewsmastMastodon::SchemaLoadMigrations), so no extra step is needed.
        run: bin/rails db:prepare

      - name: Run gem specs in host mode
        working-directory: gem
        env:
          MASTODON_ROOT: ${{ github.workspace }}/host
          NEWSMAST_STRICT_HOST_BOOT: "1"
        run: bundle exec rspec --format progress

  ci-ok:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - changelog-policy
      - lint
      - api-contract
      - test
      - test-postgres-subset
      - compatibility
      - override-drift
      - host-integration
    if: always()
    steps:
      - name: Verify required CI jobs passed
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS_JSON" > needs.json
          ruby -rjson -e '
            results = JSON.parse(File.read("needs.json")).values.map { |v| v.fetch("result") }
            blocked = results.any? { |r| r == "failure" || r == "cancelled" }
            abort("One or more required CI jobs failed or were cancelled") if blocked
            puts "All required CI jobs passed (or were skipped when not applicable)."
          '

