name: Publish to RubyGems

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: rubygems
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup runtime
        uses: ./.github/actions/setup
        with:
          ruby-version: "3.4"

      - name: Ensure release tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Ensure tag matches gem version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GEM_VERSION="$(ruby -e 'require_relative "lib/newsmast_mastodon/version"; print NewsmastMastodon::VERSION')"

          if [ "$TAG_VERSION" != "$GEM_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match gem version ($GEM_VERSION)."
            exit 1
          fi

      - name: Run test suite
        run: bundle exec rspec

      - name: Run linter
        run: bundle exec rubocop

      - name: Build gem
        run: bundle exec rake build

      - name: Generate release checksums
        run: |
          sha256sum pkg/*.gem > pkg/SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            pkg/*.gem
            pkg/SHA256SUMS

      - name: Release to RubyGems
        uses: rubygems/release-gem@052cc82692552de3ef2b81fd670e41d13cba8092 # v1.4.0
