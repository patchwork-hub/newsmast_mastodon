name: Feature request
description: Suggest an idea or enhancement for newsmast_mastodon.
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What problem are you trying to solve, and who is affected?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature or change you'd like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've tried.
  - type: dropdown
    id: consumer
    attributes:
      label: Who would use this?
      multiple: true
      options:
        - Newsmast mobile apps
        - Newsmast Dashboard
        - Server admins
        - Mastodon API clients
        - Other
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, related issues, or links to upstream Mastodon features.
