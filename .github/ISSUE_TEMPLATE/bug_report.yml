name: Bug report
description: Report a reproducible problem in newsmast_mastodon.
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Security issues:** don't open a public issue. Report them privately as described in [SECURITY.md](https://github.com/TheNewsmastFoundation/newsmast-mastodon/blob/main/SECURITY.md).

        If the problem also happens on a Mastodon server without this gem installed, please report it to [Mastodon](https://github.com/mastodon/mastodon/issues) instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, including full error messages or stack traces.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Call `GET /api/v1/...` with ...
        2. ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: gem-version
    attributes:
      label: newsmast_mastodon version
      placeholder: "4.6.5.1"
    validations:
      required: true
  - type: input
    id: mastodon-version
    attributes:
      label: Mastodon version
      placeholder: "4.6.5"
    validations:
      required: true
  - type: input
    id: ruby-version
    attributes:
      label: Ruby version
      description: Output of `ruby -v`.
      placeholder: "ruby 3.4.7"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the gem is affected?
      options:
        - API endpoints
        - Timelines and feeds
        - Push or email notifications
        - Accounts, sign-up or passwords
        - Moderation and content filters
        - Frontend (web UI overrides)
        - Search (Chewy / Elasticsearch)
        - Background jobs (Sidekiq)
        - Installation or upgrade
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Other environment details
      description: OS, PostgreSQL version, deployment method (Docker, bare metal), and relevant environment variables. Remove any secrets.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste log output here. It's formatted as code automatically. Remove tokens, emails and other personal data.
      render: shell
